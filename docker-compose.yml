version: "3.9"

services:
  # 1. The Database: Stores live prediction logs and drift metrics
  db:
    image: postgres:16
    container_name: agriprice-monitoring-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: agri_password_2026
      POSTGRES_DB: agri_monitoring
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # 2. Adminer: Web interface to check SQL tables during the demo
  adminer:
    image: adminer
    container_name: agriprice-adminer
    environment:
      ADMINER_DEFAULT_SERVER: db
    ports:
      - "8080:8080"
    depends_on:
      - db

  # 3. Grafana: For the "Visualization" step of monitoring pipeline
  grafana:
    image: grafana/grafana-oss
    container_name: agriprice-grafana
    ports:
      - "3000:3000"
    depends_on:
      - db
    volumes:
      - grafana_data:/var/lib/grafana

volumes:
  postgres_data:
  grafana_data: